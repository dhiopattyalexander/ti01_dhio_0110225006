<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout CSS Box dengan Gambar</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">

        <header class="box header">
            <img src="image/Phoebe.jpg" alt="Header Banner">
        </header>

        <div class="content">

            <div class="content-aside">
                <div class="box left-top">
                    <img src="image/phoebe4.png" alt="Gambar Kiri Atas">
                </div>
                <div class="box left-bottom">
                    <img src="image/phoebe3.png" alt="Gambar Kiri Bawah">
                </div>
            </div>

            <div class="content-main">
                <div class="box right-top">
                    <img src="image/phoebe1.png" alt="Gambar Kanan Atas">
                </div>
                <div class="box right-bottom">
                    <img src="image/phoebe2.png" alt="Gambar Kanan Bawah">
                </div>
            </div>

        </div>
    </div>
</body>

</html>
