<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout CSS Box 2 - Gambar</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">

        <header class="header-wrapper">
            <div class="box header-brand">
                <img src="images/sk1.png" alt="Header Brand Image">
            </div>
            <div class="box header-main">
                <img src="images/title.png" alt="Main Header Image">
            </div>
        </header>

        <div class="content">
            <aside class="box sidebar-left">
                <img src="images/sk2.png" alt="Sidebar Left Image">
            </aside>
            
            <main class="box main-content">
                <img src="images/sk3.png" alt="Main Content Image">
            </main>
            
            <aside class="box sidebar-right">
                <img src="images/sk4.png" alt="Sidebar Right Image">
            </aside>
        </div>

        <footer class="box footer">
            <img src="images/title.png" alt="Footer Image">
        </footer>

    </div>
</body>

</html>
