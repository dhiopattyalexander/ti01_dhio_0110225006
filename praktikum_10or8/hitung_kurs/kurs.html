<!DOCTYPE html> 
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hitung Kurs Dollar ke Rupiah</title>
</head>
<body>
    <h2>Hitung Kurs Dollar ke Rupiah</h2>
    <h4> Nilai Kurs rupiah = Rp, 16.668</h4>
    <label for="dollar">Masukkan Nilai Dollar: </label>
    <input type="number" id="dollar" placeholder="Masukkan Nilai Dollar">
    <br>
    <span id="hasil1"></span>
    <button type="button" onclick="hitung_dolar()">Hitung</button>

    <hr>
    <br>
    <h2>Hitung Kurs Rupiah ke Dollar</h2>
    <label for="rupiah">Masukkan Nilai Rupiah: </label>
    <input type="number" id="rupiah" placeholder="Masukkan Nilai Rupiah">
    <br>
    <span id="hasil2"></span>
    <button type="button" onclick="hitung_rupiah()">Hitung</button>

    <script>
        function hitung_dolar() {
            let rp= 16668;
            let d= document.getElementById("dollar").value;
            let hasil1 = d * rp;

            document.getElementById("hasil1").innerHTML = "Hasil: Rp. " + hasil1;
        }

        function hitung_rupiah() {
            let rp= 16668;
            let r= document.getElementById("rupiah").value;
            let hasil2 = r / rp;

            document.getElementById("hasil2").innerHTML = "Hasil: $ " + hasil2.toFixed(3);
        }
            
    </script>
</body>
</html>
