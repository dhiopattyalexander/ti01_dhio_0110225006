<!DOCTYPE html>
<html>
<head>
    <title>Soal 4: Penjumlahan</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
        }
        input {
            display: block;
            margin: 5px 0;
            padding: 8px;
            font-size: 16px;
            width: 200px;
        }
        span {
            font-size: 20px;
            font-weight: bold;
            margin-left: 5px;
        }
    </style>

    <script language="JavaScript">
        function hitungJumlah() {
            // 1. Ambil nilai dari input box berdasarkan ID
            var val1 = document.getElementById("bilangan_satu").value;
            var val2 = document.getElementById("bilangan_dua").value;

            // 2. Konversi nilai string ke number/float
            // Menggunakan parseFloat agar bisa menghitung desimal, atau 0 jika kosong
            var n1 = parseFloat(val1) || 0;
            var n2 = parseFloat(val2) || 0;

            // 3. Lakukan penjumlahan
            var hasil = n1 + n2;

            // 4. Masukkan hasil ke kotak input ketiga
            document.getElementById("hasil_jumlah").value = hasil;
        }
    </script>
</head>
<body>

    <h3>Soal 4: Menghitung Jumlah Dua Bilangan</h3>
    <p>Tulislah Program untuk menghitung jumlah dua bilangan, seperti tampilan berikut ini:</p>

    <input type="number" id="bilangan_satu" onChange="hitungJumlah()" placeholder="Bilangan 1">
    
    <span>+</span>
    
    <input type="number" id="bilangan_dua" onChange="hitungJumlah()" placeholder="Bilangan 2">
    
    <span>=</span>
    
    <input type="number" id="hasil_jumlah" readonly placeholder="Hasil">


</body>
</html>
