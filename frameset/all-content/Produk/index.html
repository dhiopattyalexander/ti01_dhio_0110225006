<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toko Interaktif</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header>
        <div class="container header-container">
            <img class="logo-img" src="images/logo-lexxstore.png" alt="Logo LexxStore" class="logo-image">
            <a href="   " class="logo">LEXXStore</a>
                  
            <nav class="main-nav">
                <ul>
                    <li><a href="#" class="nav-link active" data-kategori="pria">Fashion Pria</a></li>
                    <li><a href="#" class="nav-link" data-kategori="wanita">Fashion Wanita</a></li>
                    <li><a href="#" class="nav-link" data-kategori="muslim">Fashion Muslim</a></li>
                </ul>
            </nav>
            <div class="header-actions">
                <div class="search-bar">
                    <input type="text" placeholder="Search...">
                    <button>Q</button>
                </div>
                
            </div>
        </div>
    </header>

    <main class="container">
        <nav class="breadcrumbs">
            <a href="#">Home</a> &gt;
            <a href="#" id="breadcrumb-kategori">Fashion Pria</a> &gt;
            <span id="breadcrumb-produk">Kemeja Pria</span>
        </nav>

        <div class="product-detail-layout">
            <div class="product-gallery">
                <div class="main-image">
                    <img id="main-product-image" src="baju-putih.jpg" alt="Gambar Produk Utama">
                </div>
                <div class="thumbnail-images" id="thumbnail-container">
                </div>
            </div>

            <div class="product-info">
                <h1 id="product-name">Kemeja Pria</h1>
                <p class="price" id="product-price">Rp. 85.000</p>
                <div class="rating">
                    <span>★★★★★</span>
                    <a href="#">2 ulasan</a>
                </div>

                <form id="order-form">
                    <div class="variant-group">
                        <label class="variant-label">Pilih Varian: Warna</label>
                        <div class="variant-options">
                            <div class="option"><input type="radio" id="warna-hitam" name="warna" value="Hitam"
                                    checked><label for="warna-hitam">Hitam</label></div>
                            <div class="option"><input type="radio" id="warna-putih" name="warna" value="Putih"><label
                                    for="warna-putih">Putih</label></div>
                        </div>
                    </div>
                    <div class="variant-group">
                        <label class="variant-label">Ukuran</label>
                        <div class="variant-options">
                            <div class="option"><input type="radio" id="ukuran-l" name="ukuran" value="L" checked><label
                                    for="ukuran-l">L</label></div>
                            <div class="option"><input type="radio" id="ukuran-xl" name="ukuran" value="XL"><label
                                    for="ukuran-xl">XL</label></div>
                        </div>
                    </div>
                    <button type="submit" class="pesan-button">Pesan</button>
                </form>
            </div>
        </div>

        <div class="product-description">
            <h2>Deskripsi Produk</h2>
            <p id="product-description-text">Kemeja Pria nyaman untuk dipakai santai ataupun untuk pakaian formal</p>
        </div>
    </main>

    <script>
        // 1. DATABASE PRODUK (DENGAN WARNA KONSISTEN MENGGUNAKAN HURUF KECIL)
        const dataProduk = {
            pria: {
                nama: "Kemeja Pria Casual",
                harga: "Rp. 120.000",
                deskripsi: "Kemeja Pria nyaman untuk dipakai santai ataupun untuk pakaian formal. Terbuat dari bahan katun berkualitas tinggi yang adem dan awet.",
                images: [
                    { thumb: 'images/baju-hitam.jpg', large: 'images/baju-hitam.jpg', color: 'hitam' }, // <-- Diubah ke huruf kecil
                    { thumb: 'images/baju-putih.jpg', large: 'images/baju-putih.jpg', color: 'putih' }  // <-- Diubah ke huruf kecil
                ],
                breadcrumb: "Fashion Pria",
                breadcrumbProduk: "Kemeja Pria",
            },
            wanita: {
                nama: "Kaos Peggy Top",
                harga: "Rp. 120.000",
                deskripsi: "Kaos wanita dengan bahan soft cotton spandex yang lembut dan nyaman dipakai sehari-hari. Desain trendy dengan pilihan warna hitam dan putih.",
                images: [
                    { thumb: 'images/kaos-hitam.jpg', large: 'images/kaos-hitam.jpg', color: 'hitam' },
                    { thumb: 'images/kaos-putih.jpg', large: 'images/kaos-putih.jpg', color: 'putih' }  
                ],
                breadcrumb: "Fashion Wanita",
                breadcrumbProduk: "Kaos Peggy Top",
            },
            muslim: {
                nama: "Gamis Syar'i Elegan",
                harga: "Rp. 250.000",
                deskripsi: "Gamis dengan bahan polymicro premium yang nyaman dan tidak panas. Desain syar'i dengan potongan elegan, cocok untuk berbagai acara.",
                images: [
                    { thumb: 'images/gamis-hitam.jpg', large: 'images/gamis-hitam.jpg', color: 'hitam' },
                    { thumb: 'images/gamis-putih.jpg', large: 'images/gamis-putih.jpg', color: 'putih' }
                ],
                breadcrumb: "Fashion Muslim",
                breadcrumbProduk: "Gamis Elegan",
            }
        };

        // 2. SELEKSI ELEMEN
        const linkNavigasi = document.querySelectorAll('.nav-link');
        const namaProdukEl = document.getElementById('product-name');
        const hargaProdukEl = document.getElementById('product-price');
        const deskripsiProdukEl = document.getElementById('product-description-text');
        const gambarUtamaEl = document.getElementById('main-product-image');
        const thumbnailContainerEl = document.getElementById('thumbnail-container');
        const breadcrumbKategoriEl = document.getElementById('breadcrumb-kategori');
        const breadcrumbProdukEl = document.getElementById('breadcrumb-produk');

        // 3. FUNGSI UNTUK MENGUPDATE TAMPILAN
        function updateTampilan(kategori) {
            const produk = dataProduk[kategori];
            namaProdukEl.textContent = produk.nama;
            hargaProdukEl.textContent = produk.harga;
            deskripsiProdukEl.textContent = produk.deskripsi;
            breadcrumbKategoriEl.textContent = produk.breadcrumb;
            breadcrumbProdukEl.textContent = produk.breadcrumbProduk;
            gambarUtamaEl.src = produk.images[0].large;
            thumbnailContainerEl.innerHTML = '';
            produk.images.forEach((image, index) => {
                const imgEl = document.createElement('img');
                imgEl.src = image.thumb;
                imgEl.alt = `Thumbnail ${index + 1}`;
                imgEl.dataset.largeSrc = image.large;
                if (index === 0) {
                    imgEl.classList.add('active');
                }
                thumbnailContainerEl.appendChild(imgEl);
            });
            setupThumbnailClicks();
        }

        // 4. FUNGSI UNTUK MEMBUAT THUMBNAIL BISA DI-KLIK
        function setupThumbnailClicks() {
            const thumbnails = thumbnailContainerEl.querySelectorAll('img');
            thumbnails.forEach(thumb => {
                thumb.addEventListener('click', function () {
                    gambarUtamaEl.src = this.dataset.largeSrc;
                    thumbnails.forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                });
            });
        }

        // 5. BERIKAN EVENT LISTENER PADA NAVIGASI
        linkNavigasi.forEach(link => {
            link.addEventListener('click', function (event) {
                event.preventDefault();
                linkNavigasi.forEach(nav => nav.classList.remove('active'));
                this.classList.add('active');
                const kategoriTerpilih = this.dataset.kategori;
                updateTampilan(kategoriTerpilih);
            });
        });

        // 6. TAMPILKAN PRODUK PERTAMA KALI & ATUR FUNGSI FORM
        document.addEventListener('DOMContentLoaded', () => {
            updateTampilan('pria');
        });

        const orderForm = document.getElementById('order-form');
        orderForm.addEventListener('submit', function (event) {
            event.preventDefault();
            const currentProductName = document.getElementById('product-name').textContent;
            alert(`Pesanan untuk "${currentProductName}" telah diterima dan sedang diproses. Terima kasih!`);
        });

        // ### FUNGSI UNTUK MENGUBAH GAMBAR ###
        const colorOptions = document.querySelectorAll('input[name="warna"]');
        let currentCategory = 'pria';

        function handleColorChange() {
            const selectedColor = this.value.toLowerCase();
            const currentProductImages = dataProduk[currentCategory].images;

            // Cari gambar yang sesuai dengan warna yang dipilih
            const matchingImage = currentProductImages.find(img => img.color && img.color.toLowerCase() === selectedColor);

            if (matchingImage) {
                gambarUtamaEl.src = matchingImage.large;
                const allThumbnails = thumbnailContainerEl.querySelectorAll('img');
                allThumbnails.forEach(thumb => {
                    thumb.classList.remove('active');
                    if (thumb.src.includes(matchingImage.thumb)) {
                        thumb.classList.add('active');
                    }
                });
            }
        }

        colorOptions.forEach(radio => {
            radio.addEventListener('change', handleColorChange);
        });

        linkNavigasi.forEach(link => {
            link.addEventListener('click', function () {
                currentCategory = this.dataset.kategori;
            });
        });
    </script>

</body>

</html>
