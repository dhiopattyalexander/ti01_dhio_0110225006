<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Kalkulator Penjumlahan</title>
    <script>
        function jumlahkan() {
            let strbil1 = document.getElementById("bil1").value;
            let strbil2 = document.getElementById("bil2").value;
            let bil1 = parseInt(strbil1);
            let bil2 = parseInt(strbil2);
            let hasil = bil1 + bil2;
            document.getElementById("hasil").innerHTML = hasil;
        }
    </script>
</head>
<body>
    <h2>Kalkulator Penjumlahan</h2>
    <form>
        Bilangan 1: <input type="text" id="bil1"> <br>
        Bilangan 2: <input type="text" id="bil2"> <br>
        <br>
        <input type="button" value="Hitung" onclick="jumlahkan()">
        <br><br>
        Hasil Penjumlahan: <span id="hasil"></span>
    </form>
</body>
</html>
